[package]
name = "agent-telemetry"
version = "0.1.0"
edition = "2024"
description = "Observability and decision intelligence for AI agents"
license = "MIT"

[features]
default = []
duckdb-backend = ["dep:duckdb"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
duckdb = { version = "1", optional = true, features = ["bundled"] }
hex = "0.4"
opentelemetry-proto = { version = "0.32", features = ["gen-tonic-messages", "logs", "trace"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
